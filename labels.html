<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enclosure labels — UMBRA LEACHIES</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .toolbar{background:var(--panel);border:1px solid var(--line);
           padding:15px 17px;margin:24px 0 20px;font-size:13px;line-height:1.65}
  .toolbar b{color:var(--pale);font-weight:500}
  .toolbar code{font-family:var(--data);font-size:11.5px;color:var(--jade)}

  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .sheet{min-width:500px;max-width:500px;margin:0 auto;display:grid;gap:8px}

  .lbl{background:var(--ink);border:1px solid var(--line);padding:6px 10px;
       display:grid;grid-template-columns:auto 1fr auto 38px;gap:11px;
       align-items:center;break-inside:avoid}
  .col-id{text-align:center;padding-right:10px;border-right:1px solid var(--line);
          white-space:nowrap}
  .col-id svg{display:block;margin:0 auto 3px}
  .lid{font-family:var(--data);font-weight:500;font-size:10.5px;
       color:var(--jade);letter-spacing:.08em}
  .lsex{font-family:var(--data);font-size:8px;color:var(--slate);
        letter-spacing:.1em;margin-top:1px}
  .col-main{min-width:0}
  .llin{font-family:var(--display);font-size:14px;color:var(--bone);line-height:1.18}
  .ltr{font-family:var(--data);font-size:7.5px;color:var(--slate);
       margin-top:2px;letter-spacing:.03em;line-height:1.35}
  .lbrand{display:flex;align-items:center;gap:8px;margin-top:4px;white-space:nowrap}
  .lbrand .b{font-family:var(--display);font-size:7.5px;letter-spacing:.28em;
             color:var(--jade);text-indent:.28em}
  .lbrand .z{font-family:var(--cal);font-size:12px;color:var(--pale);line-height:1}
  .col-meta{text-align:right;white-space:nowrap}
  .col-meta .d{font-family:var(--data);font-size:7.5px;color:var(--bone);letter-spacing:.04em}
  .col-meta .d span{color:var(--slate);letter-spacing:.12em}
  .col-meta .loc{font-family:var(--data);font-size:6.5px;letter-spacing:.16em;
                 text-transform:uppercase;color:var(--slate);margin-top:4px}
  .col-meta .prov{font-family:var(--data);font-size:6.5px;color:var(--ochre);
                  margin-top:2px;letter-spacing:.05em}
  .col-qr{width:38px;height:38px;line-height:0;background:var(--jade)}
  .col-qr svg{width:38px;height:38px;display:block}

  @media print{
    body{background:#fff;padding:0}
    .masthead,nav,.toolbar,footer,h1.page,.lead{display:none}
    .scroll{overflow:visible;padding:0}
    .sheet{min-width:0;width:132mm;max-width:132mm;margin:0 auto;gap:0;
           grid-auto-rows:25mm}
    .lbl{border-color:#2b5d54;padding:1.8mm 3mm;
         grid-template-columns:auto 1fr auto 16mm;gap:3.5mm;overflow:hidden}
    .col-qr,.col-qr svg{width:16mm;height:16mm}
    @page{size:A4;margin:10mm}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="assets/data.js"></script>
<script src="assets/qrcode.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  const strips = COLLECTION.concat(SNAKES.map(x => Object.assign({}, x, {lineage: x.morph, locality: x.name, registry: ''}))).map(a => `
    <div class="lbl" id="${a.id}">
      <div class="col-id">
        ${MARK(17, 11)}
        <div class="lid">${a.id}</div>
        <div class="lsex">${a.sex}</div>
      </div>
      <div class="col-main">
        <div class="llin">${a.lineage}</div>
        <div class="ltr">${a.traits}</div>
        <div class="lbrand"><span class="b">UMBRA LEACHIES</span><span class="z">玄影</span></div>
      </div>
      <div class="col-meta">
        <div class="d"><span>L</span> ${a.laid}</div>
        <div class="d"><span>H</span> ${a.hatched}</div>
        <div class="loc">${a.locality}</div>
        ${a.registry ? `<div class="prov">${a.registry}</div>` : ''}
      </div>
      <div class="col-qr">${qrSvg(recordUrl(a.id), 38)}</div>
    </div>`).join('');

  document.getElementById('app').innerHTML = header('labels') + `
    <h1 class="page">Enclosure labels</h1>
    <div class="toolbar">
      <b>Print at 100% on A4 from Chrome or Safari.</b> Ten strips, each about
      132 × 25 mm — long and shallow, sized for the bottom-right corner of the
      enclosure.<br>
      Every QR opens that animal's record on this site. The codes are generated from
      wherever the page is served, so they stay correct on
      <code>${location.host || 'this site'}</code> without editing anything.<br>
      Scan one before printing the set. If the modules render soft, raise
      <code>16mm</code> in the print block of this file.
    </div>
    <div class="scroll"><div class="sheet">${strips}</div></div>
  ` + footer();
})();
</script>
</body>
</html>
